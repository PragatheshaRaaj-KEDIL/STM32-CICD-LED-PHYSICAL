name: STM32 Physical Hardware CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-flash-test:
    runs-on: [self-hosted, Windows, X64]

    defaults:
      run:
        shell: pwsh

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. SHOW ENVIRONMENT
      # ============================================================
      - name: Show environment
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "       STM32 PHYSICAL HARDWARE CI"
          Write-Host "=========================================="

          Write-Host ""
          Write-Host "Computer:"
          Write-Host $env:COMPUTERNAME

          Write-Host ""
          Write-Host "User:"
          Write-Host $env:USERNAME

          Write-Host ""
          Write-Host "Workspace:"
          Write-Host $env:GITHUB_WORKSPACE

          Write-Host ""
          Write-Host "PowerShell:"
          $PSVersionTable

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "ARM GCC"
          Write-Host "=========================================="

          $gccDir = "C:\Program Files (x86)\Arm GNU Toolchain arm-none-eabi\12.2 mpacbti-rel1\bin"
          $gcc = Join-Path $gccDir "arm-none-eabi-gcc.exe"
          $objcopy = Join-Path $gccDir "arm-none-eabi-objcopy.exe"

          if (!(Test-Path $gcc)) {
              throw "ARM GCC not found: $gcc"
          }

          if (!(Test-Path $objcopy)) {
              throw "ARM objcopy not found: $objcopy"
          }

          & $gcc --version

          if ($LASTEXITCODE -ne 0) {
              throw "ARM GCC failed."
          }

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "STM32CubeProgrammer"
          Write-Host "=========================================="

          $cli = "C:\Program Files\STMicroelectronics\STM32Cube\STM32CubeProgrammer\bin\STM32_Programmer_CLI.exe"

          if (!(Test-Path $cli)) {
              throw "STM32CubeProgrammer not found: $cli"
          }

          & $cli --version

          if ($LASTEXITCODE -ne 0) {
              throw "STM32CubeProgrammer CLI failed."
          }

          Write-Host ""
          Write-Host "ENVIRONMENT CHECK PASSED."


      # ============================================================
      # 3. BUILD STM32 FIRMWARE
      # ============================================================
      - name: Build STM32 firmware
        run: |
          $ErrorActionPreference = "Stop"

          $gccDir = "C:\Program Files (x86)\Arm GNU Toolchain arm-none-eabi\12.2 mpacbti-rel1\bin"

          $gcc = Join-Path $gccDir "arm-none-eabi-gcc.exe"
          $objcopy = Join-Path $gccDir "arm-none-eabi-objcopy.exe"

          if (!(Test-Path $gcc)) {
              throw "GCC not found: $gcc"
          }

          if (!(Test-Path $objcopy)) {
              throw "objcopy not found: $objcopy"
          }

          New-Item -ItemType Directory -Force -Path build | Out-Null

          $CFLAGS = @(
              "-mcpu=cortex-m4"
              "-mthumb"
              "-mfpu=fpv4-sp-d16"
              "-mfloat-abi=hard"
              "-DSTM32F446xx"
              "-DUSE_HAL_DRIVER"
              "-ICore/Inc"
              "-IDrivers/CMSIS/Include"
              "-IDrivers/CMSIS/Device/ST/STM32F4xx/Include"
              "-IDrivers/STM32F4xx_HAL_Driver/Inc"
          )

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "COMPILING APPLICATION"
          Write-Host "=========================================="

          & $gcc @CFLAGS -c Core/Src/main.c -o build/main.o
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          & $gcc @CFLAGS -c Core/Src/stm32f4xx_hal_msp.c -o build/stm32f4xx_hal_msp.o
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          & $gcc @CFLAGS -c Core/Src/stm32f4xx_it.c -o build/stm32f4xx_it.o
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          & $gcc @CFLAGS -c Core/Src/system_stm32f4xx.c -o build/system_stm32f4xx.o
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          & $gcc @CFLAGS -c Core/Src/syscalls.c -o build/syscalls.o
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          & $gcc @CFLAGS -c Core/Src/sysmem.c -o build/sysmem.o
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "COMPILING STM32 HAL"
          Write-Host "=========================================="

          $halFiles = Get-ChildItem "Drivers/STM32F4xx_HAL_Driver/Src/*.c"

          foreach ($file in $halFiles) {

              $name = $file.BaseName

              Write-Host "Compiling $($file.Name)"

              & $gcc @CFLAGS `
                  -c $file.FullName `
                  -o "build/$name.o"

              if ($LASTEXITCODE -ne 0) {
                  exit $LASTEXITCODE
              }
          }

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "COMPILING STARTUP"
          Write-Host "=========================================="

          & $gcc `
              -mcpu=cortex-m4 `
              -mthumb `
              -mfpu=fpv4-sp-d16 `
              -mfloat-abi=hard `
              -c Core/Startup/startup_stm32f446retx.s `
              -o build/startup.o

          if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
          }

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "LINKING FIRMWARE"
          Write-Host "=========================================="

          $objects = Get-ChildItem "build/*.o" |
              ForEach-Object { $_.FullName }

          & $gcc `
              -mcpu=cortex-m4 `
              -mthumb `
              -mfpu=fpv4-sp-d16 `
              -mfloat-abi=hard `
              $objects `
              "-TSTM32F446RETX_FLASH.ld" `
              "-Wl,--gc-sections" `
              "-specs=nano.specs" `
              "-specs=nosys.specs" `
              -o build/STM32-CICD-LED.elf

          if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
          }

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "GENERATING BIN"
          Write-Host "=========================================="

          & $objcopy `
              -O binary `
              build/STM32-CICD-LED.elf `
              build/STM32-CICD-LED.bin

          if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
          }

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "FIRMWARE OUTPUT"
          Write-Host "=========================================="

          Get-ChildItem build

          Write-Host ""
          Write-Host "BUILD SUCCESS."


      # ============================================================
      # 4. VERIFY FIRMWARE
      # ============================================================
      - name: Verify firmware
        run: |
          $ErrorActionPreference = "Stop"

          $elf = Join-Path $env:GITHUB_WORKSPACE "build\STM32-CICD-LED.elf"
          $bin = Join-Path $env:GITHUB_WORKSPACE "build\STM32-CICD-LED.bin"

          if (!(Test-Path $elf)) {
              throw "ELF firmware was not created: $elf"
          }

          if (!(Test-Path $bin)) {
              throw "BIN firmware was not created: $bin"
          }

          $elfInfo = Get-Item $elf
          $binInfo = Get-Item $bin

          Write-Host "ELF size: $($elfInfo.Length) bytes"
          Write-Host "BIN size: $($binInfo.Length) bytes"

          if ($binInfo.Length -eq 0) {
              throw "BIN firmware is empty."
          }

          Write-Host ""
          Write-Host "FIRMWARE VERIFICATION PASSED."


      # ============================================================
      # 5. DETECT STM32 PROGRAMMER
      # ============================================================
      - name: Detect STM32 programmer
        run: |
          $ErrorActionPreference = "Stop"

          $cli = "C:\Program Files\STMicroelectronics\STM32Cube\STM32CubeProgrammer\bin\STM32_Programmer_CLI.exe"

          if (!(Test-Path $cli)) {
              throw "STM32_Programmer_CLI.exe not found."
          }

          Write-Host "STM32CubeProgrammer:"
          Write-Host $cli

          & $cli --version

          if ($LASTEXITCODE -ne 0) {
              throw "STM32 Programmer CLI failed."
          }

          Write-Host "STM32 PROGRAMMER CHECK PASSED."


      # ============================================================
      # 6. DETECT PHYSICAL STM32 / ST-LINK
      # ============================================================
      - name: Detect STM32 hardware
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "PRESENT ST-LINK / STM32 DEVICES"
          Write-Host "=========================================="

          $devices = Get-PnpDevice -PresentOnly |
              Where-Object {
                  $_.FriendlyName -match "ST-Link|STM32|STMicroelectronics"
              }

          if ($null -eq $devices -or @($devices).Count -eq 0) {
              throw "No ST-Link/STM32 PnP device detected."
          }

          $devices |
              Format-Table Status,Class,FriendlyName

          Write-Host ""
          Write-Host "HARDWARE DETECTION PASSED."


      # ============================================================
      # 7. FLASH PHYSICAL STM32
      # ============================================================
      - name: Flash physical STM32
        run: |
          $ErrorActionPreference = "Stop"

          $cli = "C:\Program Files\STMicroelectronics\STM32Cube\STM32CubeProgrammer\bin\STM32_Programmer_CLI.exe"

          $firmware = Join-Path $env:GITHUB_WORKSPACE "build\STM32-CICD-LED.bin"

          if (!(Test-Path $firmware)) {
              throw "Firmware not found: $firmware"
          }

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "FLASHING PHYSICAL STM32"
          Write-Host "=========================================="

          Write-Host "Firmware:"
          Write-Host $firmware

          Write-Host ""
          Write-Host "Connecting through ST-Link SWD..."

          # IMPORTANT:
          # STM32CubeProgrammer expects:
          # -w <file> <address>
          & $cli `
              -c port=SWD `
              -w "$firmware" 0x08000000 `
              -v `
              -rst

          if ($LASTEXITCODE -ne 0) {
              throw "STM32 programming FAILED. Exit code: $LASTEXITCODE"
          }

          Write-Host ""
          Write-Host "STM32 FLASH SUCCESS."


      # ============================================================
      # 8. WAIT FOR STM32
      # ============================================================
      - name: Wait for STM32
        run: |
          Write-Host "Waiting for STM32 firmware to start..."
          Start-Sleep -Seconds 3
          Write-Host "STM32 should now be running."


      # ============================================================
      # 9. SALEAE PHYSICAL TEST
      # ============================================================
      - name: Run physical Saleae test
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "STM32 PHYSICAL SALEAE TEST"
          Write-Host "=========================================="

          if (!(Test-Path "tests/run_physical_test.py")) {
              throw "tests/run_physical_test.py not found."
          }

          if (!(Test-Path "tests/saleae_capture.py")) {
              throw "tests/saleae_capture.py not found."
          }

          if (!(Test-Path "tests/analyze_saleae.py")) {
              throw "tests/analyze_saleae.py not found."
          }

          python --version

          python tests/run_physical_test.py

          if ($LASTEXITCODE -ne 0) {
              throw "Physical hardware timing test FAILED."
          }

          Write-Host ""
          Write-Host "PHYSICAL HARDWARE TEST PASSED."


      # ============================================================
      # 10. UPLOAD SALEAE RESULTS
      # ============================================================
      - name: Upload Saleae results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stm32-saleae-results
          path: |
            test-results/saleae/**
          if-no-files-found: warn


      # ============================================================
      # 11. UPLOAD FIRMWARE
      # ============================================================
      - name: Upload firmware
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: stm32-firmware
          path: |
            build/STM32-CICD-LED.elf
            build/STM32-CICD-LED.bin