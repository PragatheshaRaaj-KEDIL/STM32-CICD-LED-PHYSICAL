name: STM32 CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-renode:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install ARM GCC
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi

      - name: Show repository contents
        run: |
          echo "===== PROJECT ====="
          find . -maxdepth 3 -type f | sort

      - name: Build STM32 firmware
        run: |
          mkdir -p build

          arm-none-eabi-gcc \
            -mcpu=cortex-m4 \
            -mthumb \
            -mfpu=fpv4-sp-d16 \
            -mfloat-abi=hard \
            -DSTM32F446xx \
            -DUSE_HAL_DRIVER \
            -ICore/Inc \
            -IDrivers/CMSIS/Include \
            -IDrivers/CMSIS/Device/ST/STM32F4xx/Include \
            -IDrivers/STM32F4xx_HAL_Driver/Inc \
            -c Core/Src/main.c \
            -o build/main.o

          arm-none-eabi-gcc \
            -mcpu=cortex-m4 \
            -mthumb \
            -mfpu=fpv4-sp-d16 \
            -mfloat-abi=hard \
            -DSTM32F446xx \
            -DUSE_HAL_DRIVER \
            -ICore/Inc \
            -IDrivers/CMSIS/Include \
            -IDrivers/CMSIS/Device/ST/STM32F4xx/Include \
            -IDrivers/STM32F4xx_HAL_Driver/Inc \
            -c Core/Src/stm32f4xx_hal_msp.c \
            -o build/stm32f4xx_hal_msp.o

          arm-none-eabi-gcc \
            -mcpu=cortex-m4 \
            -mthumb \
            -mfpu=fpv4-sp-d16 \
            -mfloat-abi=hard \
            -DSTM32F446xx \
            -DUSE_HAL_DRIVER \
            -ICore/Inc \
            -IDrivers/CMSIS/Include \
            -IDrivers/CMSIS/Device/ST/STM32F4xx/Include \
            -IDrivers/STM32F4xx_HAL_Driver/Inc \
            -c Core/Src/stm32f4xx_it.c \
            -o build/stm32f4xx_it.o

          arm-none-eabi-gcc \
            -mcpu=cortex-m4 \
            -mthumb \
            -mfpu=fpv4-sp-d16 \
            -mfloat-abi=hard \
            -DSTM32F446xx \
            -DUSE_HAL_DRIVER \
            -ICore/Inc \
            -IDrivers/CMSIS/Include \
            -IDrivers/CMSIS/Device/ST/STM32F4xx/Include \
            -IDrivers/STM32F4xx_HAL_Driver/Inc \
            -c Core/Src/system_stm32f4xx.c \
            -o build/system_stm32f4xx.o

          arm-none-eabi-gcc \
            -mcpu=cortex-m4 \
            -mthumb \
            -mfpu=fpv4-sp-d16 \
            -mfloat-abi=hard \
            -DSTM32F446xx \
            -DUSE_HAL_DRIVER \
            -ICore/Inc \
            -IDrivers/CMSIS/Include \
            -IDrivers/CMSIS/Device/ST/STM32F4xx/Include \
            -IDrivers/STM32F4xx_HAL_Driver/Inc \
            -c Drivers/STM32F4xx_HAL_Driver/Src/stm32f4xx_hal.c \
            -o build/stm32f4xx_hal.o

          arm-none-eabi-gcc \
            -mcpu=cortex-m4 \
            -mthumb \
            -mfpu=fpv4-sp-d16 \
            -mfloat-abi=hard \
            -DSTM32F446xx \
            -DUSE_HAL_DRIVER \
            -ICore/Inc \
            -IDrivers/CMSIS/Include \
            -IDrivers/CMSIS/Device/ST/STM32F4xx/Include \
            -IDrivers/STM32F4xx_HAL_Driver/Inc \
            -c Core/Src/syscalls.c \
            -o build/syscalls.o

          arm-none-eabi-gcc \
            -mcpu=cortex-m4 \
            -mthumb \
            -mfpu=fpv4-sp-d16 \
            -mfloat-abi=hard \
            -DSTM32F446xx \
            -DUSE_HAL_DRIVER \
            -ICore/Inc \
            -IDrivers/CMSIS/Include \
            -IDrivers/CMSIS/Device/ST/STM32F4xx/Include \
            -IDrivers/STM32F4xx_HAL_Driver/Inc \
            -c Core/Src/sysmem.c \
            -o build/sysmem.o

          arm-none-eabi-gcc \
            -mcpu=cortex-m4 \
            -mthumb \
            -mfpu=fpv4-sp-d16 \
            -mfloat-abi=hard \
            -c Core/Startup/startup_stm32f446retx.s \
            -o build/startup.o

          arm-none-eabi-gcc \
            -mcpu=cortex-m4 \
            -mthumb \
            -mfpu=fpv4-sp-d16 \
            -mfloat-abi=hard \
            build/*.o \
            -TSTM32F446RETX_FLASH.ld \
            -Wl,--gc-sections \
            -specs=nano.specs \
            -specs=nosys.specs \
            -o build/STM32-CICD-LED.elf

          arm-none-eabi-objcopy \
            -O binary \
            build/STM32-CICD-LED.elf \
            build/STM32-CICD-LED.bin

      - name: Verify firmware
        run: |
          test -f build/STM32-CICD-LED.elf
          test -f build/STM32-CICD-LED.bin
          echo "STM32 firmware build successful."

      - name: Download Renode
        run: |
          wget -q https://github.com/renode/renode/releases/download/v1.16.1/renode-1.16.1.linux-dotnet.tar.gz

          mkdir -p renode
          tar -xzf renode-1.16.1.linux-dotnet.tar.gz -C renode

          echo "===== Renode files ====="
          find renode -maxdepth 3 -type f | sort

          echo "===== Renode executable ====="
          find renode -type f -name renode -print

      - name: Run Renode blink test
        run: |
          RENODE=$(find renode -type f -name renode | head -n 1)

          if [ -z "$RENODE" ]; then
            echo "ERROR: Renode executable not found."
            exit 1
          fi

          chmod +x "$RENODE"

          echo "Using Renode: $RENODE"

          "$RENODE" \
            --console \
            --disable-xwt \
            --execute "include @tests/blink_ci.resc"