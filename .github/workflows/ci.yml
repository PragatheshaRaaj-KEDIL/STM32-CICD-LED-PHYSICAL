name: STM32 CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-stm32:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install ARM GCC
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi

      - name: Show ARM GCC version
        run: |
          arm-none-eabi-gcc --version

      - name: Create build directory
        run: |
          mkdir -p build

      - name: Compile STM32 source files
        run: |
          arm-none-eabi-gcc \
            -mcpu=cortex-m4 \
            -mthumb \
            -mfpu=fpv4-sp-d16 \
            -mfloat-abi=hard \
            -DUSE_HAL_DRIVER \
            -DSTM32F446xx \
            -ICore/Inc \
            -IDrivers/CMSIS/Include \
            -IDrivers/CMSIS/Device/ST/STM32F4xx/Include \
            -IDrivers/STM32F4xx_HAL_Driver/Inc \
            -c Core/Src/main.c \
            -o build/main.o

          arm-none-eabi-gcc \
            -mcpu=cortex-m4 \
            -mthumb \
            -mfpu=fpv4-sp-d16 \
            -mfloat-abi=hard \
            -DUSE_HAL_DRIVER \
            -DSTM32F446xx \
            -ICore/Inc \
            -IDrivers/CMSIS/Include \
            -IDrivers/CMSIS/Device/ST/STM32F4xx/Include \
            -IDrivers/STM32F4xx_HAL_Driver/Inc \
            -c Core/Src/stm32f4xx_hal_msp.c \
            -o build/stm32f4xx_hal_msp.o

          arm-none-eabi-gcc \
            -mcpu=cortex-m4 \
            -mthumb \
            -mfpu=fpv4-sp-d16 \
            -mfloat-abi=hard \
            -DUSE_HAL_DRIVER \
            -DSTM32F446xx \
            -ICore/Inc \
            -IDrivers/CMSIS/Include \
            -IDrivers/CMSIS/Device/ST/STM32F4xx/Include \
            -IDrivers/STM32F4xx_HAL_Driver/Inc \
            -c Core/Src/stm32f4xx_it.c \
            -o build/stm32f4xx_it.o

          arm-none-eabi-gcc \
            -mcpu=cortex-m4 \
            -mthumb \
            -mfpu=fpv4-sp-d16 \
            -mfloat-abi=hard \
            -DUSE_HAL_DRIVER \
            -DSTM32F446xx \
            -ICore/Inc \
            -IDrivers/CMSIS/Include \
            -IDrivers/CMSIS/Device/ST/STM32F4xx/Include \
            -IDrivers/STM32F4xx_HAL_Driver/Inc \
            -c Core/Src/system_stm32f4xx.c \
            -o build/system_stm32f4xx.o

      - name: Compile HAL drivers
        run: |
          for src in Drivers/STM32F4xx_HAL_Driver/Src/*.c; do
            name=$(basename "$src" .c)

            arm-none-eabi-gcc \
              -mcpu=cortex-m4 \
              -mthumb \
              -mfpu=fpv4-sp-d16 \
              -mfloat-abi=hard \
              -DUSE_HAL_DRIVER \
              -DSTM32F446xx \
              -ICore/Inc \
              -IDrivers/CMSIS/Include \
              -IDrivers/CMSIS/Device/ST/STM32F4xx/Include \
              -IDrivers/STM32F4xx_HAL_Driver/Inc \
              -c "$src" \
              -o "build/$name.o"
          done

      - name: Compile startup file
        run: |
          arm-none-eabi-gcc \
            -mcpu=cortex-m4 \
            -mthumb \
            -mfpu=fpv4-sp-d16 \
            -mfloat-abi=hard \
            -c Core/Startup/startup_stm32f446retx.s \
            -o build/startup_stm32f446retx.o

      - name: Link STM32 ELF
        run: |
          arm-none-eabi-gcc \
            -mcpu=cortex-m4 \
            -mthumb \
            -mfpu=fpv4-sp-d16 \
            -mfloat-abi=hard \
            -TSTM32F446RETX_FLASH.ld \
            -Wl,-Map=build/STM32-CICD-LED.map \
            build/*.o \
            -o build/STM32-CICD-LED.elf \
            --specs=nosys.specs \
            -Wl,--gc-sections

      - name: Generate binary
        run: |
          arm-none-eabi-objcopy \
            -O binary \
            build/STM32-CICD-LED.elf \
            build/STM32-CICD-LED.bin

      - name: Show build output
        run: |
          ls -lh build/
          arm-none-eabi-size build/STM32-CICD-LED.elf

      - name: Verify firmware
        run: |
          test -f build/STM32-CICD-LED.elf
          test -f build/STM32-CICD-LED.bin
          echo "STM32 firmware build successful."
      - name: Download Renode
        run: |
          wget -q https://github.com/renode/renode/releases/download/v1.16.1/renode-1.16.1.linux-dotnet.tar.gz
          tar -xzf renode-1.16.1.linux-dotnet.tar.gz
          mv renode-1.16.1 linux-renode

           - name: Download Renode
        run: |
          wget -q https://github.com/renode/renode/releases/download/v1.16.1/renode-1.16.1.linux-dotnet.tar.gz

          mkdir -p renode
          tar -xzf renode-1.16.1.linux-dotnet.tar.gz -C renode

          echo "===== Renode files ====="
          find renode -maxdepth 3 -type f | sort

          echo "===== Renode executable ====="
          find renode -type f -name renode -print

      - name: Run Renode blink test
        run: |
          RENODE=$(find renode -type f -name renode | head -n 1)

          if [ -z "$RENODE" ]; then
            echo "ERROR: Renode executable not found."
            exit 1
          fi

          chmod +x "$RENODE"

          echo "Using Renode: $RENODE"

          "$RENODE" \
            --console \
            --disable-xwt \
            --execute "include @tests/blink_ci.resc"